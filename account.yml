spring:
  application:
    name: account
  
  datasource:
    url: jdbc:postgresql://localhost:5434/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1
jwt:
  secret: ${JWT_SECRET}


server:
  port: 8030