spring:
  application:
    name: notification

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true